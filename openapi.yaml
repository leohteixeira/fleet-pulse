openapi: 3.0.3
info:
  title: Fleet Pulse
  version: 0.1.0
  description: >
    Single-process fleet simulator. HTTP endpoints plus an embedded SPA.
    No authentication. Last-known rental state is persisted in PostgreSQL.
    Leasing writes require Idempotency-Key. Policy and visitor audit are
    server-owned. Calendar rate is environment-only (CALENDAR_RATE).
    GET /api/stream requires fleet=rental|leasing.
servers:
  - url: http://127.0.0.1:8300
paths:
  /api/clock:
    get:
      summary: Simulated calendar
      operationId: getClock
      responses:
        '200':
          description: Simulated date, rate (and ×N), and real time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clock'
  /api/leasing/vehicles:
    get:
      summary: Leasing snapshot
      operationId: getLeasingVehicles
      responses:
        '200':
          description: Financed roster with last-known telem when present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeasingSnapshot'
  /api/contracts:
    get:
      summary: Active leasing book
      operationId: getContracts
      parameters:
        - name: overdueBand
          in: query
          schema:
            type: string
            enum: [em_dia, 1_15, 16_30, acima_30]
        - name: vehicleState
          in: query
          schema:
            type: string
            enum: [ativo, armado, bloqueado, desbloqueio_pendente]
      responses:
        '200':
          description: Active contracts with days late and overdue band
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractList'
  /api/contracts/{id}:
    get:
      summary: Contract detail
      operationId: getContract
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Contract plus installments and audit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDetail'
        '404':
          description: Unknown contract
  /api/contracts/{id}/notify:
    post:
      summary: Notify a late contract
      operationId: notifyContract
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Notify recorded; same key replays the original record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResult'
        '400':
          description: Missing Idempotency-Key
        '404':
          description: Unknown contract
        '413':
          description: Body larger than 8 KiB
        '422':
          description: Policy refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyError'
  /api/contracts/{id}/block:
    post:
      summary: Request a leasing immobilizer command
      operationId: blockContract
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockRequest'
      responses:
        '202':
          description: Block accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          description: Missing Idempotency-Key
        '404':
          description: Unknown contract
        '413':
          description: Body larger than 8 KiB
        '422':
          description: Policy refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyError'
  /api/contracts/{id}/block/cancel:
    post:
      summary: Cancel an armed block or unlock a blocked VIN
      operationId: cancelBlock
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled or unlock accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          description: Missing Idempotency-Key
        '404':
          description: Unknown contract
        '413':
          description: Body larger than 8 KiB
        '422':
          description: Command in transit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyError'
  /api/contracts/{id}/payments:
    post:
      summary: Record a visitor payment
      operationId: payContract
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          description: Missing Idempotency-Key
        '404':
          description: Unknown contract
        '413':
          description: Body larger than 8 KiB
        '422':
          description: No installment overdue or due within 5 simulated days
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyError'
  /api/vehicles:
    get:
      summary: Fleet snapshot
      operationId: getVehicles
      responses:
        '200':
          description: Current vehicles and the allowed Centro polygon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
  /api/stream:
    get:
      summary: Live telemetry, command, and area-exit events
      operationId: getStream
      parameters:
        - name: fleet
          in: query
          required: true
          schema:
            type: string
            enum: [rental, leasing]
      responses:
        '200':
          description: Server-sent events for one fleet; per-client buffer drops the oldest frame
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Missing or unknown fleet query
  /api/vehicles/{vin}/unlock:
    post:
      summary: Unlock a vehicle
      operationId: unlockVehicle
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Command accepted or queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          description: Missing Idempotency-Key
        '404':
          description: Unknown VIN
        '409':
          description: Queue full; body is the in-flight command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
  /api/vehicles/{vin}/lock:
    post:
      summary: Lock a vehicle
      operationId: lockVehicle
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Command accepted or queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          description: Missing Idempotency-Key
        '404':
          description: Unknown VIN
        '409':
          description: Queue full; body is the in-flight command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
  /api/commands/{id}:
    get:
      summary: Command state
      description: Returns a rental door command or a leasing block/unlock command by id. JSON keys are the same for both fleets.
      operationId: getCommand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current command record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '404':
          description: Unknown command
  /healthz:
    get:
      summary: Readiness
      operationId: healthz
      responses:
        '200':
          description: Process is up and the database pool is reachable
        '503':
          description: Database pool is unreachable
components:
  parameters:
    Vin:
      name: vin
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    ContractId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Snapshot:
      type: object
      required: [polygon, vehicles]
      properties:
        polygon:
          $ref: '#/components/schemas/Polygon'
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
    Polygon:
      type: object
      required: [south, north, west, east]
      properties:
        south: { type: number }
        north: { type: number }
        west: { type: number }
        east: { type: number }
    Vehicle:
      type: object
      required: [vin, displayId]
      properties:
        vin: { type: string }
        displayId: { type: string }
        lat: { type: number }
        lng: { type: number }
        plate: { type: string }
        model: { type: string }
        battery: { type: number }
        speed: { type: number }
        heading: { type: number }
        ignition: { type: boolean }
        locked: { type: boolean }
        odometer: { type: number }
        trip: { type: number }
    CommandAccepted:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state:
          $ref: '#/components/schemas/CommandState'
    Command:
      type: object
      properties:
        id: { type: string }
        vin: { type: string }
        action:
          type: string
          enum: [unlock, lock, block]
        state:
          $ref: '#/components/schemas/CommandState'
        correlationId: { type: string }
    CommandState:
      type: string
      enum: [PENDING, SENT, ACKED, FAILED, TIMEOUT, REQUESTED, ARMED, CANCELLED]
    Clock:
      type: object
      required: [simulated, real, rate, multiplier]
      properties:
        simulated: { type: string, format: date-time }
        real: { type: string, format: date-time }
        rate:
          type: string
          enum: [1h/s, 4h/s, 12h/s]
        multiplier: { type: integer }
    ContractList:
      type: object
      required: [contracts]
      properties:
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/Contract'
    Contract:
      type: object
      required: [id, vin, clientName, payerProfile, daysLate, overdueBand]
      properties:
        id: { type: string }
        vin: { type: string }
        clientName: { type: string }
        payerProfile:
          type: string
          enum: [pontual, atrasa_ocasionalmente, regulariza_apos_notificacao, inadimplente]
        daysLate: { type: integer }
        overdueBand:
          type: string
          enum: [em_dia, 1_15, 16_30, acima_30]
    LeasingSnapshot:
      type: object
      required: [vehicles]
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
    ContractDetail:
      allOf:
        - $ref: '#/components/schemas/Contract'
        - type: object
          required: [installments, audit]
          properties:
            installments:
              type: array
              items:
                $ref: '#/components/schemas/Installment'
            audit:
              type: array
              items:
                $ref: '#/components/schemas/AuditEntry'
    Installment:
      type: object
      required: [id, dueOn, amount, paid]
      properties:
        id: { type: string }
        dueOn: { type: string, format: date }
        amount: { type: string }
        paid: { type: boolean }
    AuditEntry:
      type: object
      required: [action, origin, createdAt]
      properties:
        id: { type: integer }
        action: { type: string }
        origin:
          type: string
          enum: [VISITANTE, SISTEMA]
        visitorHash: { type: string }
        createdAt: { type: string, format: date-time }
    BlockRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 8
          maxLength: 280
    WriteResult:
      type: object
      required: [id, action]
      properties:
        id: { type: string }
        action: { type: string }
    PaymentResult:
      type: object
      required: [id, installmentId, vin, daysLate]
      properties:
        id: { type: string }
        installmentId: { type: string }
        vin: { type: string }
        daysLate: { type: integer }
    PolicyError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - late_below_16
            - notify_required
            - notify_too_recent
            - device_offline
            - reason_invalid
            - in_day
            - notify_cooldown
            - payment_not_due
            - in_transit
        message: { type: string }
