# Local development only. Supply credentials from env.example:
#   cp env.example .env && docker compose up -d
name: fleet-pulse

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetpulse}
      POSTGRES_DB: ${POSTGRES_DB:-fleetpulse}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - fleet_pulse_pg:/var/lib/postgresql/data

volumes:
  fleet_pulse_pg:
