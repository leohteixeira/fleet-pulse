name: fleet-pulse-prod
services:
  app:
    restart: unless-stopped
    labels:
      portfolio.production: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: portfolio.production,com.docker.compose.project,com.docker.compose.service
    image: portfolio/fleet-pulse:${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: .
      args:
        VITE_BASE_PATH: /fleet-pulse/
    mem_limit: 256m
    stop_grace_period: 20s
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:?Set AUDIT_HASH_SECRET}
      TRUST_FORWARDED_FOR: "true"
      SIM_SEED: "1"
      CALENDAR_RATE: ${CALENDAR_RATE:-4h/s}
      GOMEMLIMIT: 192MiB
      GOMAXPROCS: "2"
    networks:
      edge:
        aliases: [fleet-pulse-app]
      data: {}
networks:
  edge:
    external: true
    name: portfolio-edge
  data:
    external: true
    name: portfolio-data
